<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TagAll</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>TagAll</h1>
      <p class="subtitle">Prepare group mentions. You review and send the message.</p>
      <button id="tag-all" class="primary">Prepare @ mentions</button>
      <button id="cancel" class="secondary" hidden>Stop</button>
      <p id="status" role="status">Open a WhatsApp Web group chat to begin.</p>
      <label class="setting"><input id="show-inline" type="checkbox" checked /> Show the @ All button in group chats</label>
      <p class="notice">TagAll processes group names in your browser. It does not send messages or upload chat data.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
