<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="At symbol">
  <!-- The 10px inset keeps the mark clear of Chrome's icon mask and surrounding UI. -->
  <rect x="10" y="10" width="108" height="108" rx="28" fill="#0b8f74"/>
  <!-- Deliberately a single, high-contrast @ glyph: it remains legible at 16px. -->
  <text x="63" y="91" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="88" font-weight="700" text-anchor="middle">@</text>
</svg>
